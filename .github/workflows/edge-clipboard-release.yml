# Builds a signed Android App Bundle (.aab) for Google Play.
# Needs 4 repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Edge Clipboard release bundle

on:
  workflow_dispatch:
  push:
    tags: ["edge-clipboard-v*"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-clipboard-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Write signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build bundle
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Remove signing files
        if: always()
        run: rm -f upload.jks keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: edge-clipboard-release-aab
          path: edge-clipboard-android/app/build/outputs/bundle/release/app-release.aab
