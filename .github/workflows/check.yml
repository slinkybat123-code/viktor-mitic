name: Site check

# Runs on every update and once a week, so a broken link or a missing image
# (the artwork images still live on artorwar.com) is noticed quickly.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pages match the generator
        run: |
          python build.py
          git diff --exit-code -- '*.html' sitemap.xml robots.txt
      - name: Links, images and 3D frames
        run: python check.py
