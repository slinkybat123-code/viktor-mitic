# Generate the Xcode project on a Mac:  brew install xcodegen && xcodegen generate
name: EdgeClipboard
options:
  bundleIdPrefix: io.github.slinkybat123
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""   # your Apple Team ID (Xcode > Signing & Capabilities fills this)
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  EdgeClipboard:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.slinkybat123.edgeclip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Edge Clipboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Edge Clipboard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: App/EdgeClipboard.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.slinkybat123.edgeclip]
    dependencies:
      - target: EdgeClipboardKeyboard
      - target: EdgeClipboardShare
      - target: EdgeClipboardWidget

  EdgeClipboardKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.slinkybat123.edgeclip.keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Edge Clipboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.slinkybat123.edgeclip]

  EdgeClipboardShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.slinkybat123.edgeclip.share
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Edge Clipboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.slinkybat123.edgeclip]

  EdgeClipboardWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.slinkybat123.edgeclip.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Edge Clipboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.slinkybat123.edgeclip]
